[project]
name = "fourier-basis-db"
version = "0.1.0"
description = "Generate and preview Fourier basis image datasets"
requires-python = ">=3.12.16,<3.13"
dependencies = [
  "hydra-core>=1.3.2,<1.4",
  "numpy>=1.26,<3",
  "omegaconf>=2.3,<3",
  "pillow>=13",
  "torch>=2.6",
  "torchvision>=0.21",
  "tqdm>=4.67",
]

[dependency-groups]
dev = ["pytest>=9", "pip-audit>=2.10"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
