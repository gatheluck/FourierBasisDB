name: Python 3.12
on:
  pull_request:
  push:
    branches: [codex/python312-migration-20261030]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv pip check
      - run: uv export --locked --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
      - run: uv run --no-sync pip-audit -r /tmp/requirements.txt --disable-pip --no-deps
