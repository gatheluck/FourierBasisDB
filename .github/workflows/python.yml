name: Python 3.12
on:
  pull_request:
  push:
    branches: [codex/python312-migration-20261030]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv pip check
      - run: uv export --locked --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
      - run: uv run --no-sync pip-audit -r /tmp/requirements.txt --disable-pip --no-deps
      # CPU wheels use a local version suffix that PyPI audit cannot look up.
      # Audit their upstream versions separately rather than silently omitting them.
      - run: |
          uv run --no-sync python - <<'PYCODE' > /tmp/pytorch-upstream.txt
          from importlib.metadata import version
          for name in ("torch", "torchvision"):
              print(name + "==" + version(name).split("+")[0])
          PYCODE
      - run: uv run --no-sync pip-audit -r /tmp/pytorch-upstream.txt --disable-pip --no-deps
